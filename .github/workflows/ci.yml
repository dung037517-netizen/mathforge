name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test (question bank audits, engine, models)
        run: npm test
      - name: Build
        run: npm run build
      - name: No uses of `any`
        run: |
          if grep -rnE ':\s*any\b|<any>|\bas any\b' --include='*.ts' --include='*.tsx' app components lib types; then
            echo "Found a use of any." && exit 1
          fi
